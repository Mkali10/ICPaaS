# Verifies PostgreSQL 17, migrations, and deployment configuration
name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  dotnet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet restore ICPaaS.sln
      - run: dotnet build ICPaaS.sln -c Release --no-restore
      - name: Validate release tooling
        run: sh -n scripts/icpaas && sh -n scripts/icpaas-recording-uploader && sh -n scripts/acceptance.sh && sh -n scripts/migrate.sh
  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: POSTGRES_PASSWORD=test REDIS_PASSWORD=test TURN_SHARED_SECRET=test TURN_REALM=turn.invalid docker compose -f compose.yml config --quiet
  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: POSTGRES_PASSWORD=test REDIS_PASSWORD=test TURN_SHARED_SECRET=test TURN_REALM=turn.invalid docker compose -f compose.yml --profile standalone up -d --wait postgres
      - if: failure()
        run: POSTGRES_PASSWORD=test REDIS_PASSWORD=test TURN_SHARED_SECRET=test TURN_REALM=turn.invalid docker compose -f compose.yml logs postgres
      - run: POSTGRES_PASSWORD=test REDIS_PASSWORD=test TURN_SHARED_SECRET=test TURN_REALM=turn.invalid docker compose -f compose.yml --profile standalone run --rm migrate
      - run: POSTGRES_PASSWORD=test REDIS_PASSWORD=test TURN_SHARED_SECRET=test TURN_REALM=turn.invalid docker compose -f compose.yml --profile standalone run --rm migrate
      - name: Verify all migrations applied once
        run: test "$(POSTGRES_PASSWORD=test REDIS_PASSWORD=test TURN_SHARED_SECRET=test TURN_REALM=turn.invalid docker compose -f compose.yml exec -T postgres psql -p 55432 -U icpaas -d icpaas -Atc 'SELECT count(*) FROM schema_migrations')" = "7"
      - if: always()
        run: POSTGRES_PASSWORD=test REDIS_PASSWORD=test TURN_SHARED_SECRET=test TURN_REALM=turn.invalid docker compose -f compose.yml --profile standalone down -v
