# Verifies PostgreSQL 17, migrations, and deployment configuration
name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  dotnet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet restore ICPaaS.sln
      - run: dotnet build ICPaaS.sln -c Release --no-restore
      - name: Validate release tooling
        run: sh -n scripts/icpaas && sh -n scripts/icpaas-recording-uploader && sh -n scripts/acceptance.sh && sh -n scripts/migrate.sh
      - name: Validate frontend policy and syntax
        run: '! grep -R ''onclick="show'' src/IcpaaS.Api/wwwroot --include="*.js" && node --check src/IcpaaS.Api/wwwroot/app.js && node --check src/IcpaaS.Api/wwwroot/entitlements.js && node --check src/IcpaaS.Api/wwwroot/contact-center.js && node --check src/IcpaaS.Api/wwwroot/supervisor.js && node --check src/IcpaaS.Api/wwwroot/recordings.js && node scripts/access-contract.mjs'
  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: POSTGRES_PASSWORD=test REDIS_PASSWORD=test TURN_SHARED_SECRET=test TURN_REALM=turn.invalid docker compose -f compose.yml config --quiet
  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: POSTGRES_PASSWORD=test REDIS_PASSWORD=test TURN_SHARED_SECRET=test TURN_REALM=turn.invalid docker compose -f compose.yml --profile standalone up -d --wait postgres
      - if: failure()
        run: POSTGRES_PASSWORD=test REDIS_PASSWORD=test TURN_SHARED_SECRET=test TURN_REALM=turn.invalid docker compose -f compose.yml logs postgres
      - run: POSTGRES_PASSWORD=test REDIS_PASSWORD=test TURN_SHARED_SECRET=test TURN_REALM=turn.invalid docker compose -f compose.yml --profile standalone run --rm migrate
      - run: POSTGRES_PASSWORD=test REDIS_PASSWORD=test TURN_SHARED_SECRET=test TURN_REALM=turn.invalid docker compose -f compose.yml --profile standalone run --rm migrate
      - name: Verify backup archive contract
        run: rm -rf data/recordings && mkdir -p data/keys && POSTGRES_PASSWORD=test REDIS_PASSWORD=test TURN_SHARED_SECRET=test TURN_REALM=turn.invalid ./scripts/icpaas backup && POSTGRES_PASSWORD=test REDIS_PASSWORD=test TURN_SHARED_SECRET=test TURN_REALM=turn.invalid ./scripts/icpaas verify-backup "$(find backups -maxdepth 1 -type f -name 'icpaas-*.tar.gz' | head -1)"
      - name: Verify report SQL
        run: POSTGRES_PASSWORD=test REDIS_PASSWORD=test TURN_SHARED_SECRET=test TURN_REALM=turn.invalid docker compose -f compose.yml exec -T postgres psql -p 55432 -U icpaas -d icpaas -v ON_ERROR_STOP=1 -c 'SELECT created_at::date AS "day", count(*) total FROM calls GROUP BY created_at::date ORDER BY "day"'
      - name: Verify all migrations applied once
        run: test "$(POSTGRES_PASSWORD=test REDIS_PASSWORD=test TURN_SHARED_SECRET=test TURN_REALM=turn.invalid docker compose -f compose.yml exec -T postgres psql -p 55432 -U icpaas -d icpaas -Atc 'SELECT count(*) FROM schema_migrations')" = "8"
      - if: always()
        run: POSTGRES_PASSWORD=test REDIS_PASSWORD=test TURN_SHARED_SECRET=test TURN_REALM=turn.invalid docker compose -f compose.yml --profile standalone down -v
