name: icpaas
services:
  api:
    build:
      context: .
      dockerfile: src/IcpaaS.Api/Dockerfile
    env_file: [.env]
    environment:
      ICPaaS__Database__ConnectionString: ${ICPaaS_DATABASE_CONNECTION_STRING:-Host=postgres;Port=${POSTGRES_PORT:-55432};Database=${POSTGRES_DB:-icpaas};Username=${POSTGRES_USER:-icpaas};Password=${POSTGRES_PASSWORD}}
    ports: ["${ICPaaS_API_BIND:-127.0.0.1}:${ICPaaS_API_PORT:-18080}:8080"]
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    volumes: ["./data/keys:/home/app/.aspnet/DataProtection-Keys", "./data/recordings:/var/lib/icpaas/recordings"]
    tmpfs: ["/tmp:rw,noexec,nosuid,size=64m"]
    depends_on:
      migrate:
        condition: service_completed_successfully
        required: false
    profiles: ["standalone", "application", "distributed"]
  postgres:
    image: postgres:17-alpine
    command: ["postgres", "-p", "${POSTGRES_PORT:-55432}"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-icpaas}
      POSTGRES_USER: ${POSTGRES_USER:-icpaas}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -p ${POSTGRES_PORT:-55432} -U ${POSTGRES_USER:-icpaas} -d ${POSTGRES_DB:-icpaas}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    profiles: ["standalone"]
  migrate:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-icpaas}
      POSTGRES_USER: ${POSTGRES_USER:-icpaas}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      PGHOST: ${POSTGRES_HOST:-postgres}
      PGPORT: ${POSTGRES_PORT:-55432}
    depends_on:
      postgres:
        condition: service_healthy
        required: false
    volumes:
      - ./database/migrations:/migrations:ro
      - ./scripts/migrate.sh:/migrate.sh:ro
    entrypoint: ["/bin/sh", "/migrate.sh"]
    restart: "no"
    profiles: ["standalone", "application", "distributed"]
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--port", "${REDIS_PORT:-56379}", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD}"]
    restart: unless-stopped
    profiles: ["standalone", "distributed"]
  coturn:
    image: coturn/coturn:alpine
    command: ["-n", "--log-file=stdout", "--listening-port=${TURN_PORT:-53478}", "--tls-listening-port=${TURN_TLS_PORT:-55443}", "--min-port=${TURN_RELAY_MIN:-50000}", "--max-port=${TURN_RELAY_MAX:-50199}", "--use-auth-secret", "--static-auth-secret=${TURN_SHARED_SECRET:?set TURN_SHARED_SECRET}", "--realm=${TURN_REALM:?set TURN_REALM}", "--fingerprint", "--no-cli"]
    ports:
      - "${TURN_PORT:-53478}:${TURN_PORT:-53478}/udp"
      - "${TURN_PORT:-53478}:${TURN_PORT:-53478}/tcp"
      - "${TURN_TLS_PORT:-55443}:${TURN_TLS_PORT:-55443}/tcp"
      - "${TURN_RELAY_MIN:-50000}-${TURN_RELAY_MAX:-50199}:${TURN_RELAY_MIN:-50000}-${TURN_RELAY_MAX:-50199}/udp"
    restart: unless-stopped
    profiles: ["media-bundled"]
volumes:
  postgres_data:
